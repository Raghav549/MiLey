<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <title>MiLey — Global Beats, Your Stage | mileymusic.space</title>
    <meta name="description" content="MiLey (mileymusic.space) — Stream music from channels everywhere, upload your own tracks with custom song themes, and join live voice rooms." />
    <link rel="canonical" href="https://mileymusic.space/" />
    <meta property="og:title" content="MiLey — Global Beats, Your Stage" />
    <meta property="og:site_name" content="mileymusic.space" />
    <meta property="og:url" content="https://mileymusic.space" />
    <meta name="theme-color" content="#0B0B0B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      html {
        min-height: calc(100% + var(--sat));
        -webkit-tap-highlight-color: transparent;
        -webkit-overflow-scrolling: touch;
        touch-action: manipulation;
      }
      html, body { overscroll-behavior: none; margin: 0; }
      body { min-height: 100dvh; overflow: hidden; background: rgb(var(--color-bg, 11 11 11)); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
      #app-shell { display: contents; }
      #app-shell > #root { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
      #app-shell > #root > .h-full:first-child > :last-child:not(.fixed) { position: relative; z-index: 50; }
    </style>
  </head>
  <body>
    <div id="app-shell"><div id="root"></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
