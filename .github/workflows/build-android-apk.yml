name: Build Installable Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Installable MiLey APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install web dependencies & build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_OWNER_ID: ${{ secrets.VITE_APP_OWNER_ID }}
          VITE_SITE_URL: https://mileymusic.space
        run: |
          npm install
          npm run build
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Gradle 8.5
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle-8.5.zip
          sudo unzip -q -o /tmp/gradle-8.5.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Generate Android Release Signing Keystore
        working-directory: android/app
        run: |
          if [ ! -f miley-release.keystore ]; then
            keytool -genkeypair -v \
              -keystore miley-release.keystore \
              -alias miley \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass mileymusic2026 \
              -keypass mileymusic2026 \
              -dname "CN=mileymusic.space, OU=Mobile, O=MiLey, L=Patna, S=Bihar, C=IN"
          fi

      - name: Build Signed Release & Debug APKs with Gradle
        working-directory: android
        run: |
          /opt/gradle-8.5/bin/gradle assembleRelease assembleDebug --no-daemon --stacktrace
          mkdir -p ../apk-dist
          cp app/build/outputs/apk/release/app-release.apk ../apk-dist/MiLey-installable.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../apk-dist/MiLey-debug.apk
          ls -lh ../apk-dist/

      - name: Upload Installable APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiLey-Installable-Android-APK
          path: |
            apk-dist/MiLey-installable.apk
            apk-dist/MiLey-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Installable APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk apk-dist/MiLey-installable.apk apk-dist/MiLey-debug.apk --clobber
          else
            gh release create latest-apk apk-dist/MiLey-installable.apk apk-dist/MiLey-debug.apk \
              --title "MiLey Installable Android APK (mileymusic.space)" \
              --notes "Direct installable signed Android APK (MiLey-installable.apk) and Debug APK (MiLey-debug.apk) for https://mileymusic.space with original Emerald & Pink (#0B0B0B) design, custom SVG icons, Animated Splash Screen, Camera Top Bar Pro Music Banner, Bulk Song Upload with Direct Upload Song Themes, Voice Rooms, and Channels."
          fi
